<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Victoria Kirichenko | R&D Leader</title>
    <meta
      name="description"
      content="R&D Team Leader who treats the system and the people as one problem. I build systems that scale - and teams that want to. Strong code needs strong culture; I build both."
    />
    <meta property="og:title" content="Victoria Kirichenko | R&D Leader" />
    <meta
      property="og:description"
      content="Systems that scale, teams that want to. Strong code needs strong culture - I build both."
    />
    <meta property="og:type" content="website" />
    <!-- ?v= busts social scrapers' cache (they key on the exact URL); bump it
         whenever scripts/gen-og.mjs regenerates the card. -->
    <meta property="og:image" content="https://victoriakirichenko.com/og-preview.png?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Victoria Kirichenko - R&D Leader. Systems that scale, teams that want to."
    />
    <meta property="og:url" content="https://victoriakirichenko.com/" />
    <meta property="og:site_name" content="Victoria Kirichenko Portfolio" />
    <link rel="canonical" href="https://victoriakirichenko.com/" />

    <!-- Twitter Card tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Victoria Kirichenko | R&D Leader" />
    <meta
      name="twitter:description"
      content="Systems that scale, teams that want to. Strong code needs strong culture - I build both."
    />
    <meta name="twitter:image" content="https://victoriakirichenko.com/og-preview.png?v=2" />
    <meta
      name="twitter:image:alt"
      content="Victoria Kirichenko - R&D Leader. Systems that scale, teams that want to."
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=3" />
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=3" />
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=3" />
    <meta name="msapplication-TileImage" content="apple-touch-icon.png?v=3" />
    <!-- LCP image: preload so the download starts with the HTML, not after the
         JS bundle executes. Keep imagesrcset/imagesizes in sync with the
         <picture> in hero.tsx. type=image/avif makes non-AVIF browsers skip
         the preload (they still get WebP from the <picture> fallback). -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      imagesrcset="/victoria-portrait-480.avif 480w, /victoria-portrait-768.avif 768w, /victoria-portrait-1024.avif 1024w"
      imagesizes="(min-width: 1024px) 420px, 100vw"
      fetchpriority="high"
    />
    <!-- Fonts are self-hosted (scripts/gen-fonts.mjs -> fonts.css). Preload only
         the Inter variable file: it covers all above-the-fold text; the other
         families render below the fold and can load with the CSS. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-300_700.woff2" crossorigin />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Victoria Kirichenko",
        "jobTitle": "R&D Team Leader",
        "url": "https://victoriakirichenko.com/",
        "image": "https://victoriakirichenko.com/og-preview.png",
        "sameAs": ["https://www.linkedin.com/in/victoria-kirichenko/"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
